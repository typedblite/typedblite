version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must not be newer than `engines.vscode` in apps/vscode (^1.91.0): packaging refuses it.
      - dependency-name: "@types/vscode"
      # A NestJS major moves the engine host and `@devx-micro/app-*` together, by hand.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      nx:
        patterns: ["nx", "@nx/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
