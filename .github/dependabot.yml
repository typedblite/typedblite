version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A release waits two weeks before it is offered. Security updates are not delayed.
    cooldown:
      default-days: 14
      exclude: ["@devx-micro/*"]
    ignore:
      # The types must not be newer than `engines.vscode` in apps/vscode (^1.91.0): packaging refuses it.
      - dependency-name: "@types/vscode"
      # A NestJS major moves the engine host and `@devx-micro/app-*` together, by hand.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # The language client and server stay on one major, and `langium` decides the server's.
      - dependency-name: "vscode-languageclient"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vscode-languageserver"
        update-types: ["version-update:semver-major"]
      # VS Code hands the extension its own markdown-it, so our copy and its types follow VS Code, not the latest.
      - dependency-name: "markdown-it"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: @swc-node/register, Nx and TypeDoc do not accept it yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Moves with the language server packages above.
      - dependency-name: "vscode-jsonrpc"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      # Capacitor's packages move together, majors included. apps/sync-demo/mobile/package.json pins the same
      # versions and is not a workspace, so change it by hand in the same pull request.
      capacitor:
        patterns: ["@capacitor/*"]
      nx:
        patterns: ["nx", "@nx/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
