name: Feature request
description: Ask for a construct, a capability or an improvement.
labels: [enhancement, needs-caller]
body:
  - type: markdown
    attributes:
      value: |
        TypeDBLite adds a TypeQL construct **only when there is a real caller for it**. A request that
        names its caller is much easier to accept. Questions and open-ended ideas belong in
        [Discussions](../discussions).
  - type: textarea
    id: caller
    attributes:
      label: The caller
      description: The real query, application or specification scenario that needs this. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Any workaround, and what it costs you.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help build this.
