# The gate from CONTRIBUTING.md, run on every pull request and every push to main.
# The checkout is clean, so this is the "clean tree" gate: build, typecheck, test.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # A job marked experimental reports its result but does not fail the run.
    # macOS is experimental until it is made blocking (the plan's S8). Windows has been blocking since #39,
    # after its first two complete green runs (43618713890, 43619313563).
    # 22.16.0 is the declared minimum: the first Node 22 whose node:sqlite includes FTS5, which the
    # engine requires. 22.12 to 22.15 are not supported (22.12 has no node:sqlite at all).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24", experimental: false }
          - { os: ubuntu-latest, node: "22", experimental: false }
          - { os: ubuntu-latest, node: "22.16.0", experimental: false }
          - { os: macos-latest, node: "24", experimental: true }
          - { os: windows-latest, node: "24", experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # What `npm publish` would ship (tools/check-packages.mjs).
      - run: npm run check-packages
      # The API reference builds cleanly, and every type the API mentions is exported (tools/check-api.mjs).
      - run: npm run check-api
      # `npm test` includes the conformance report card: it fails if any feature's passing count
      # drops below libs/conformance/baseline.json, and if an improvement was not raised.
      # GitHub sets CI=true on every runner, and vitest.shared.ts turns coverage, with its 80%
      # thresholds, on whenever CI is set. The gate runs without coverage, and the `coverage` job
      # checks the floor separately. Every project has been above it since decision 9 (the launch plan).
      - run: npm test
        env:
          CI: ""

  # The plan's clean-room test: the npm tarballs installed in an empty directory outside the checkout, and used
  # (tools/clean-room.mjs). macOS and Windows are experimental, a failure there not failing the run: on Windows the CLI
  # goes through npm's .cmd shim, and the quoting of its arguments is untested.
  clean-room:
    name: clean room (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24", experimental: false }
          - { os: ubuntu-latest, node: "22.16.0", experimental: false }
          - { os: macos-latest, node: "24", experimental: true }
          - { os: windows-latest, node: "24", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run clean-room

  # The 80% coverage thresholds in vitest.shared.ts. Every project passes them since decision 9 (the
  # launch plan): tests raised, and only host-only code excluded, by name, in each project's
  # vitest.config.ts. Still non-blocking: making it blocking is the founder's call.
  coverage:
    name: coverage (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CI: "true"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  conformance-report:
    name: conformance report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the report card
        run: npm exec nx -- run typedblite-conformance:report 2>&1 | tee conformance-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance-report.txt
          retention-days: 90

  # "Runs in browsers" is a claim, so something has to guard it (ADR-009).
  wasm-and-browser:
    name: wasm and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking until its first runs on a hosted runner have been read. The one known failure
    # (a fixed 900 ms wait in replication-correctness, ~5x too short for WASM SQLite) is fixed, and
    # the suite passes locally on Node 22.23; the browser half has not been run anywhere yet.
    # WASM is slower than node:sqlite, so other fixed waits could still bite on a slow runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm exec nx -- run typedblite-runtime:test-wasm
      - run: npx playwright-core install --with-deps chromium
      # A targeted suite of three tests in a real Chromium: the 80% coverage floor (which GitHub's
      # CI=true switches on) is meaningless for it, and scored 17.8% on the first run. The tests pass.
      - run: npm exec nx -- run typedblite-runtime:test-browser
        env:
          CI: ""

  # The editor needs a display. Experimental until it has been seen stable on a hosted runner.
  vscode-e2e:
    name: vscode e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npm exec nx -- run typeqlite-vscode:e2e
