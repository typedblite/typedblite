# The PR title names the merge commit and is what the pull request list and the history show.
# Pull requests are merged with a merge commit, never squashed or rebased, so each commit keeps its own
# history; CONTRIBUTING.md asks for Conventional Commits on those commits too.
#
# The type is enforced. The scope is not: this repository uses scopes for packages and for areas of the
# documentation (`docs(debugger)`, `docs(planning)`), and a fixed list rejected a valid one.
#
# Run by hand on the pull request's branch: `gh workflow run pr-title.yml --ref <branch>`. It reads the title of the
# open pull request from that branch. Run it again after changing the title.
name: PR title

on:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  # The job's name is the check that branch protection requires.
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      # Checks out nothing: only the title is read, and it is passed to the shell as data.
      - name: Check the pull request's title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json title --jq '.[0].title // empty')"
          if [ -z "$title" ]; then echo "::error::no open pull request from $GITHUB_REF_NAME"; exit 1; fi
          pattern='^(feat|fix|docs|test|perf|refactor|build|ci|chore|revert)(\([^()]+\))?!?: .+'
          if ! [[ "$title" =~ $pattern ]]; then
            echo "::error::the title is not a Conventional Commit: <type>(<optional scope>): <subject>"; exit 1
          fi
