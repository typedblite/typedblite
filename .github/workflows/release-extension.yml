# 🔴 NEVER RUN. GitHub Actions has been off since 2026-11-14 (billing), and this workflow was written after that.
# Its local steps were run by hand (docs/development/releasing.md says which); the publishing steps, the
# marketplaces' tokens and the workflow itself have not been. Read its first run before trusting it.
#
# Publishes a VS Code extension to the Visual Studio Marketplace and Open VSX for a tag, then creates the GitHub
# Release with the .vsix attached:
#   typeqlite-v<version>        the TypeDBLite extension (apps/vscode)
#   typeqlite-theme-v<version>  the TypeQLite Theme Bridge (apps/vscode/theme-bridge)
# Each is versioned on its own, in its own package.json and CHANGELOG.md. The npm packages are release.yml's.
name: Release extension

on:
  push:
    tags: ["typeqlite-v*", "typeqlite-theme-v*"]

permissions:
  contents: write # the GitHub Release

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment: set "required reviewers" on it, so a pushed tag waits for the maintainer to approve
    # the publish. It holds the two marketplace tokens.
    environment: marketplaces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Which extension, and check the tag, the version and the release notes agree
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            typeqlite-theme-v*) dir=apps/vscode/theme-bridge; prefix=typeqlite-theme-v ;;
            typeqlite-v*)       dir=apps/vscode;              prefix=typeqlite-v ;;
            *) echo "::error::unexpected tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$prefix$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $dir/package.json's version $version"; exit 1
          fi
          node tools/release-notes.mjs --changelog "$dir/CHANGELOG.md" "$version" > "$RUNNER_TEMP/notes.md"
          case "$version" in *-*) prerelease=--pre-release ;; *) prerelease= ;; esac
          echo "vsix=apps/vscode/dist/$name-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      # Packages both extensions, then installs both into a downloaded VS Code and runs the cases against the
      # installed copies. Electron needs a display.
      - run: xvfb-run --auto-servernum npm exec nx -- run typeqlite-vscode:e2e

      - name: Publish to the Visual Studio Marketplace
        working-directory: apps/vscode
        run: npx vsce publish --packagePath "../../${{ steps.release.outputs.vsix }}" ${{ steps.release.outputs.prerelease }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish "${{ steps.release.outputs.vsix }}" ${{ steps.release.outputs.prerelease }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.release.outputs.vsix }}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
