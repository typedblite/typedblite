# 🔴 The publish job has NEVER RUN. The build job runs on any pull request that changes this file.
#
# Publishes both VS Code extensions, TypeDBLite (apps/vscode) and the TypeQLite Theme Bridge
# (apps/vscode/theme-bridge), to Open VSX, then creates the GitHub Release with both .vsix files attached. They
# share one version, so one tag releases both:
#
#   typedblite-v<version>        a release
#   typedblite-v<version>-pre    that version as a pre-release
#
# <version> is the manifests', always plain x.y.z: a marketplace refuses a suffix. The npm packages are release.yml's.
#
# Open VSX is published by Trusted Publishing: the job exchanges GitHub's OIDC ID token for a short-lived one, so
# there is no stored token. open-vsx.org holds one trusted publisher per extension, naming this repository, THIS
# FILE NAME and the `marketplaces` environment; renaming either breaks publishing. See docs/development/releasing.md.
#
# The Visual Studio Marketplace is published too once the `marketplaces` environment has a VSCE_PAT secret.
name: Release extension

on:
  push:
    tags: ["typedblite-v*"]
  pull_request:
    paths: [.github/workflows/release-extension.yml]

permissions:
  contents: read

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests with no publishing rights: this is where dependencies' install scripts run.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the tag, the versions and the release notes agree
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./apps/vscode/package.json').version")"
          bridge="$(node -p "require('./apps/vscode/theme-bridge/package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version $version is not x.y.z; a pre-release is marked by the tag's -pre"; exit 1
          fi
          if [ "$bridge" != "$version" ]; then
            echo "::error::the Theme Bridge is at $bridge and the extension at $version"; exit 1
          fi
          prerelease=false
          # A pull request has no tag: it checks everything else.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              "typedblite-v$version")     ;;
              "typedblite-v$version-pre") prerelease=true ;;
              *) echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1 ;;
            esac
          fi
          mkdir -p "$RUNNER_TEMP/release"
          {
            echo "## TypeDBLite"
            node tools/release-notes.mjs --changelog apps/vscode/CHANGELOG.md "$version"
            echo
            echo "## TypeQLite Theme Bridge"
            node tools/release-notes.mjs --changelog apps/vscode/theme-bridge/CHANGELOG.md "$version"
          } > "$RUNNER_TEMP/release/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      # Packages both extensions, then installs both into a downloaded VS Code and runs the cases against the
      # installed copies. Electron needs a display.
      - run: xvfb-run --auto-servernum npm exec nx -- run typeqlite-vscode:e2e

      # Pre-release is a property written into the .vsix when it is packaged; publishing a built .vsix cannot add it.
      # The e2e above has already built the bundles and notices, so this only packages them again.
      - name: Package as pre-releases
        if: steps.release.outputs.prerelease == 'true'
        run: |
          for dir in apps/vscode apps/vscode/theme-bridge; do
            (cd "$dir" && npx vsce package --no-dependencies --pre-release --out "$GITHUB_WORKSPACE/apps/vscode/dist/")
          done

      - name: Collect what will be published
        run: |
          version="${{ steps.release.outputs.version }}"
          cp "apps/vscode/dist/typedblite-workbench-$version.vsix" "apps/vscode/dist/typeqlite-theme-$version.vsix" "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for the maintainer's approval, and is the environment the trusted publishers name.
    environment: marketplaces
    permissions:
      contents: write # the GitHub Release
      id-token: write # Open VSX Trusted Publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: release

      # The Theme Bridge first: the extension's README sends remote-window users to it. A version already published
      # is skipped, so a run that stopped halfway can be run again.
      - name: Publish to Open VSX
        run: |
          for vsix in "typeqlite-theme-$VERSION.vsix" "typedblite-workbench-$VERSION.vsix"; do
            npx --yes ovsx@1.3.0 publish "$vsix" --trusted-publishing --skip-duplicate
          done

      - name: Publish to the Visual Studio Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        run: |
          for vsix in "typeqlite-theme-$VERSION.vsix" "typedblite-workbench-$VERSION.vsix"; do
            npx --yes @vscode/vsce@3.9.2 publish --packagePath "$vsix" --skip-duplicate
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create the GitHub Release
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./*.vsix "${flags[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
