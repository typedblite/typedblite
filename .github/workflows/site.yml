# 🔴 OFF on GitHub, like every workflow here (billing, 2026-11-14), and never run: until it is enabled the site is
# built by hand with `npm exec nx -- run website:check`. Deploying needs the repository's Pages source set to
# "GitHub Actions" (Settings, Pages) and the custom domain typedblite.dev pointed at GitHub (docs/development/website.md).
#
# Builds the site (the guides, the API reference and the playground) and publishes it to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "apps/playground/**"
      - "docs/**"
      - "libs/*/src/**"
      - "libs/*/README.md"
      - "apps/*/README.md"
      - "*.md"
      - "typedoc.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # website:check builds everything the site contains, then fails on any broken internal link.
      - run: npm exec nx -- run website:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
