<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub in a Worker (spike)</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #e3e6ec; --on: #12805c; --off: #c4320a; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --card: #1a202b; --ink: #e8ebf1; --muted: #98a2b3; --line: #2a3242; --on: #3ccb8f; --off: #ff8a65; --accent: #7c95ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  section.hub { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #hub-state { font-weight: 700; } #hub-state[data-tone="on"] { color: var(--on); } #hub-state[data-tone="off"] { color: var(--off); }
  #hub-state[data-stale] { text-decoration: underline wavy; }
  button { font: inherit; font-weight: 600; padding: 6px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #hub-info, #log { color: var(--muted); font-size: 13px; }
  #hub-tasks { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
  .devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  iframe { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
</style>
</head>
<body>
<h1>TypeDBLite hub in a Worker <small style="font-weight:400;color:var(--muted)">— spike</small></h1>
<section class="hub">
  <div class="row"><span id="hub-state">Hub …</span><button id="toggle">Take the hub down</button><span>tasks on the hub: <b id="hub-count">–</b></span></div>
  <div id="hub-info"></div><div id="log"></div>
  <ul id="hub-tasks"></ul>
</section>
<div class="devices">
  <iframe title="Device A" src="/device.html?device=a"></iframe>
  <iframe title="Device B" src="/device.html?device=b"></iframe>
  <iframe title="Device C" src="/device.html?device=c"></iframe>
</div>
<script type="module" src="/spike-page.js"></script>
</body>
</html>
